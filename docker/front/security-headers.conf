# En-têtes de sécurité, inclus dans chaque bloc location qui pose ses propres
# en-têtes : nginx n'hérite pas des add_header du niveau supérieur dans un
# bloc qui en définit (directive add_header, documentation de nginx).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Aucune page de Luniqo n'a à être affichée dans un cadre.
add_header X-Frame-Options DENY always;
# Politique de sécurité du contenu (ADR-002 § 5) : tout vient de Luniqo même.
# Vite ne produit aucun script en ligne ; la police est servie par le front.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Fonctions du navigateur dont Luniqo n'a pas besoin.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
