# Configuration Alembic (migrations du schéma v2).
# L'URL de la base n'est pas ici : migrations/env.py la construit à partir
# des variables d'environnement (voir app/config.py).

[alembic]
script_location = %(here)s/migrations
# Rend le paquet « app » importable depuis migrations/env.py.
prepend_sys_path = %(here)s
# Séparateur explicite des chemins ci-dessus (évite un avertissement de dépréciation d'Alembic).
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = [api] %(levelname)s %(name)s : %(message)s
