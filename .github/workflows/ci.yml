# Intégration continue de Luniqo (LUN-008, compétence C2.1.2).
#
# À chaque PR et à chaque push sur les branches durables (develop = INT,
# staging = PRÉ-PROD, main = PROD ; voir CONTRIBUTING.md) :
#   api     lint (ruff), tests unitaires et tests d'intégration sur une vraie PostgreSQL
#   images  construction des 5 images Docker (le front y passe par next build, donc
#           par la vérification TypeScript), puis démarrage de la pile et sondes
#
# Les actions tierces sont épinglées par SHA de commit (le numéro de version en
# commentaire) : une étiquette peut être déplacée, un SHA non.
name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

# Lecture seule : la CI ne publie rien et n'écrit pas dans le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests unitaires et d'intégration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Dépendances (versions figées)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff, règles de sécurité comprises)
        run: ruff check --output-format=github .

      - name: Image de la base de test (luniqo/db, construite depuis scratch)
        working-directory: docker
        run: docker compose build db

      - name: Base PostgreSQL jetable
        run: |
          scripts/test-db.sh up | tee "$RUNNER_TEMP/test-db.txt"
          grep '^export ' "$RUNNER_TEMP/test-db.txt" | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"

      - name: Tests unitaires et d'intégration
        run: pytest -ra --junitxml="$GITHUB_WORKSPACE/reports/pytest.xml"

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-api
          path: reports/pytest.xml
          retention-days: 90

      - name: Arrêt de la base de test
        if: always()
        run: scripts/test-db.sh down

  images:
    name: Images Docker et démarrage de la pile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construction des 5 images (aucune image Docker Hub)
        run: docker compose build

      - name: Tailles des images
        run: docker image ls 'luniqo/*' --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Démarrage de la pile (healthchecks)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Sondes via la passerelle
        run: |
          for path in /healthz /api/health /api/docs /login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
          # Sans session, une route protégée doit refuser.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v2/nurseries)
          echo "/api/v2/nurseries sans session -> $code"
          [ "$code" = 401 ]

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v
