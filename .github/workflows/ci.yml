# Intégration continue de Luniqo (LUN-008, compétence C2.1.2).
#
# À chaque PR et à chaque push sur les branches durables (develop = INT,
# staging = PRÉ-PROD, main = PROD ; voir CONTRIBUTING.md) :
#   api     lint (ruff), tests unitaires et tests d'intégration sur une vraie PostgreSQL
#   front   front v2 (front/) : contrat d'API à jour, lint, typage, tests unitaires,
#           tests de composants et stories dans Chromium, build, build de Storybook
#   images  construction des 4 images Docker (web construit le front v2), démarrage
#           de la pile, sondes, puis parcours Playwright contre la vraie API
#   ci-docker  la chaîne du TP Docker : conteneurs lint puis test (docker/pipeline.sh)
#
# Les actions tierces sont épinglées par SHA de commit (le numéro de version en
# commentaire) : une étiquette peut être déplacée, un SHA non.
name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

# Lecture seule : la CI ne publie rien et n'écrit pas dans le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests unitaires et d'intégration)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - name: Dépendances (versions figées)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff, règles de sécurité comprises)
        run: ruff check --output-format=github .

      - name: Image de la base de test (luniqo/db, construite depuis scratch)
        working-directory: docker
        run: docker compose build db

      - name: Base PostgreSQL jetable
        run: |
          scripts/test-db.sh up | tee "$RUNNER_TEMP/test-db.txt"
          grep '^export ' "$RUNNER_TEMP/test-db.txt" | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"

      - name: Tests unitaires et d'intégration
        run: pytest -ra --junitxml="$GITHUB_WORKSPACE/reports/pytest.xml"

      - name: Conserver le rapport de tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-tests-api
          path: reports/pytest.xml
          retention-days: 90

      - name: Arrêt de la base de test
        if: always()
        run: scripts/test-db.sh down

  front:
    name: Front v2 (contrat, lint, typage, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Version de pnpm lue dans le champ packageManager de front/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: front/package.json
          cache: true
          cache_dependency_path: front/pnpm-lock.yaml

      # Python sert à exporter le schéma OpenAPI depuis le code de l'API.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Dépendances (versions figées, scripts d'installation refusés sauf liste)
        run: |
          pnpm install --frozen-lockfile
          pip install -r ../api/requirements.txt

      - name: Contrat d'API à jour (schéma et types générés identiques aux fichiers versionnés)
        run: |
          pnpm api:types
          git diff --exit-code -- src/api/ || {
            echo "::error::Le schéma OpenAPI a changé : lancer « pnpm api:types » dans front/ et versionner src/api/."
            exit 1
          }

      - name: Lint (ESLint, Prettier)
        run: pnpm lint

      - name: Typage (TypeScript strict)
        run: pnpm typecheck

      - name: Navigateur des tests (Chromium)
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests unitaires, de composants et stories (Vitest)
        run: pnpm test

      - name: Build de production
        run: pnpm exec vite build

      - name: Build de Storybook
        run: pnpm build-storybook

      - name: Conserver le site Storybook (documentation des composants)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook
          path: front/storybook-static
          retention-days: 30

  images:
    name: Images Docker et démarrage de la pile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construction des 4 images (aucune image Docker Hub)
        run: docker compose build

      - name: Tailles des images
        run: docker image ls 'luniqo/*' --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      # Mot de passe des comptes de démonstration : tiré au hasard à chaque exécution.
      - name: Mot de passe de démonstration
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::$password"
          echo "API_SEED_DEMO_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Démarrage de la pile (healthchecks)
        run: docker compose up -d --wait --wait-timeout 180

      - name: Sondes via la passerelle
        run: |
          for path in /healthz /api/health /api/docs / /connexion /accueil; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            echo "$path -> $code"
            [ "$code" = 200 ] || exit 1
          done
          # Sans session, une route protégée doit refuser.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v2/nurseries)
          echo "/api/v2/nurseries sans session -> $code"
          [ "$code" = 401 ]
          # Le front est servi avec sa politique de sécurité du contenu.
          curl -sI http://localhost:8080/connexion | grep -qi "^content-security-policy: default-src 'self'"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: front/package.json
          cache: true
          cache_dependency_path: front/pnpm-lock.yaml

      - name: Parcours de bout en bout (Playwright, vraie API)
        working-directory: front
        env:
          E2E_PASSWORD: ${{ env.API_SEED_DEMO_PASSWORD }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: front/playwright-report
          retention-days: 30

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  ci-docker:
    name: Chaîne de CI en conteneurs (lint → test, TP Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Mêmes contrôles que le job api, mais dans nos images luniqo/lint et
      # luniqo/test : elles sont ainsi construites et éprouvées à chaque PR.
      # LINT_RUFF_FORMAT=github : erreurs de ruff en annotations sur la PR.
      - name: lint → test (pipeline.sh, sans déploiement)
        env:
          LINT_RUFF_FORMAT: github
        run: ./pipeline.sh --no-deploy

      - name: Conserver les rapports (ruff, ShellCheck, FROM, JUnit)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-ci-docker
          path: docker/reports
          retention-days: 30
